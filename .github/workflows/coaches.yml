name: Coaches (nightly)

# Nutrition + training coach, once a night. Cron is UTC; 20:05 UTC ~= 21:05 London
# in summer (BST) / 20:05 in winter. Adjust if you want it dead-on 9pm year round.
on:
  schedule:
    - cron: "5 20 * * *"
  workflow_dispatch:

jobs:
  coaches:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COACH_WINDOW_DAYS: ${{ secrets.COACH_WINDOW_DAYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Nutrition coach
        run: python scripts/coach_nutrition.py
      - name: Training coach
        run: python scripts/coach_training.py
