name: Telegram food logger

# Polls Telegram for new messages and logs food/supps/bodyweight to Supabase.
# Every 5 min (free on a public repo). Workouts are NOT handled here — Hevy does that.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-food
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
      # Optional override, e.g. gemini-2.5-flash. Defaults to gemini-flash-lite-latest.
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_CHAT_MODEL: ${{ secrets.GEMINI_CHAT_MODEL }}
      # Hold a long-poll connection ~4.5 min so replies land in seconds (cron restarts it).
      RUN_SECONDS: "270"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Poll Telegram
        run: python scripts/telegram_food.py
